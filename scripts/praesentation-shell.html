<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bfw-primary:       #0EA5A4;
  --bfw-primary-dark:  #0F766E;
  --bfw-accent:        #F59E0B;
  --bfw-warn:          #F97316;
  --bfw-success:       #10B981;
  --bfw-ink:           #0F172A;
  --bfw-ink-soft:      #475569;
  --bfw-bg:            #FAFAFA;
  --bfw-bg-teal:       #ECFEFF;
  --bfw-bg-amber:      #FEF3C7;
  --bfw-bg-rose:       #FFE4E6;
  --bfw-border:        #E2E8F0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: var(--bfw-ink); background: var(--bfw-bg); }

.deck { position: relative; width: 100vw; height: 100vh; }
.slide {
  position: absolute; inset: 0;
  display: none;
  padding: 4rem 6rem;
  flex-direction: column;
  justify-content: center;
  background: white;
  animation: fadeIn 0.35s ease;
}
.slide.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

h1 { font-size: 3.5rem; line-height: 1.1; color: var(--bfw-primary-dark); margin-bottom: 1rem; letter-spacing: -0.02em; }
h2 { font-size: 2.4rem; color: var(--bfw-primary-dark); margin-bottom: 1.5rem; }
h3 { font-size: 1.4rem; color: var(--bfw-primary); margin-bottom: 0.8rem; font-weight: 600; }
p { font-size: 1.25rem; line-height: 1.55; margin-bottom: 0.8rem; color: var(--bfw-ink); }
ul, ol { margin: 0.5rem 0 1rem 1.5rem; }
li { font-size: 1.2rem; line-height: 1.6; margin-bottom: 0.4rem; }
.subtitle { font-size: 1.4rem; color: var(--bfw-ink-soft); margin-bottom: 2rem; font-weight: 500; }
.muted { color: var(--bfw-ink-soft); }

/* Deckblatt */
.cover { background: linear-gradient(135deg, var(--bfw-bg-teal) 0%, white 60%, var(--bfw-bg-amber) 100%); }
.cover-tag {
  display: inline-block;
  padding: 0.4rem 1rem;
  background: var(--bfw-primary);
  color: white;
  border-radius: 999px;
  font-weight: 600;
  font-size: 1rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 1.5rem;
}
.cover-meta { display: flex; gap: 2rem; margin-top: 2rem; color: var(--bfw-ink-soft); font-size: 1.1rem; }
.cover-meta span strong { color: var(--bfw-ink); display: block; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }

/* Karten-Grid */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; margin-top: 1.5rem; }
.card { background: white; border: 1px solid var(--bfw-border); border-radius: 14px; padding: 1.4rem; box-shadow: 0 2px 8px rgba(15,23,42,0.04); }
.card.teal { background: var(--bfw-bg-teal); border-color: var(--bfw-primary); }
.card.amber { background: var(--bfw-bg-amber); border-color: var(--bfw-accent); }
.card.rose { background: var(--bfw-bg-rose); border-color: var(--bfw-warn); }
.card-title { font-size: 1.15rem; font-weight: 700; color: var(--bfw-primary-dark); margin-bottom: 0.5rem; }
.card.amber .card-title { color: var(--bfw-warn); }

/* Merksatz */
.merksatz {
  background: var(--bfw-bg-teal);
  border-left: 6px solid var(--bfw-primary);
  border-radius: 8px;
  padding: 1rem 1.4rem;
  margin: 1.2rem 0;
  font-size: 1.15rem;
}
.merksatz-label { font-weight: 700; color: var(--bfw-primary-dark); display: block; margin-bottom: 0.3rem; font-size: 1rem; }

/* Tabellen */
table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 1.1rem; }
th { background: var(--bfw-bg-teal); color: var(--bfw-primary-dark); text-align: left; padding: 0.7rem 1rem; font-weight: 700; }
td { padding: 0.7rem 1rem; border-bottom: 1px solid var(--bfw-border); }

/* Diagramm-Container für Rough.js */
.figure { margin: 1.5rem auto; text-align: center; }
.figure svg { max-width: 100%; height: auto; }
.caption { color: var(--bfw-ink-soft); font-size: 0.95rem; margin-top: 0.5rem; }

/* Navigation */
.nav { position: fixed; bottom: 1rem; right: 1.5rem; display: flex; gap: 0.5rem; align-items: center; z-index: 100; }
.nav button {
  border: none; background: var(--bfw-primary); color: white;
  width: 44px; height: 44px; border-radius: 50%;
  font-size: 1.2rem; cursor: pointer;
  box-shadow: 0 2px 8px rgba(15,23,42,0.12);
  transition: all 0.15s;
}
.nav button:hover { background: var(--bfw-primary-dark); transform: translateY(-1px); }
.nav-counter { background: white; padding: 0.4rem 0.9rem; border-radius: 999px; font-weight: 600; color: var(--bfw-ink-soft); font-size: 0.95rem; box-shadow: 0 2px 8px rgba(15,23,42,0.06); }

.slide-num { position: fixed; bottom: 1rem; left: 1.5rem; color: var(--bfw-ink-soft); font-size: 0.9rem; }

/* Listen mit Icons */
.checklist { list-style: none; margin-left: 0; }
.checklist li { padding-left: 2rem; position: relative; }
.checklist li::before { content: "✓"; position: absolute; left: 0; top: 0; color: var(--bfw-success); font-weight: 700; font-size: 1.3rem; }

.numlist { list-style: none; margin-left: 0; counter-reset: numitem; }
.numlist li { padding-left: 3rem; position: relative; counter-increment: numitem; margin-bottom: 0.8rem; }
.numlist li::before {
  content: counter(numitem);
  position: absolute; left: 0; top: 0;
  width: 2rem; height: 2rem;
  background: var(--bfw-primary); color: white;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.95rem;
}

/* Sprechnotizen: in der Zuschauer-Ansicht (und beim Teilen) immer unsichtbar */
.notes { display: none !important; }

/* Referentenansicht (?ref=1) */
body.ref-mode { background: #0F172A; overflow: hidden; }
body.ref-mode .deck, body.ref-mode .slide-num { display: none; }
body.ref-mode .nav { display: none; }
#refUI { display: none; }
body.ref-mode #refUI {
  display: grid; height: 100vh; padding: 1rem; gap: 1rem;
  grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
  grid-template-rows: auto minmax(0, 1fr);
}
.ref-head {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 1.2rem;
  color: #E2E8F0; font-size: 1rem;
}
.ref-head .ref-title { font-weight: 700; color: white; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-head .ref-clock, .ref-head .ref-timer { font-variant-numeric: tabular-nums; background: #1E293B; padding: 0.35rem 0.8rem; border-radius: 8px; }
.ref-head .ref-timer { color: #FDE68A; cursor: pointer; }
.ref-head .ref-counter { background: var(--bfw-primary); color: white; font-weight: 700; padding: 0.35rem 0.8rem; border-radius: 8px; }
.ref-left { display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
.ref-mini { position: relative; overflow: hidden; border-radius: 10px; background: white; border: 2px solid #334155; flex: 1; min-height: 0; }
.ref-mini.next { flex: 0 0 32%; opacity: 0.85; }
.ref-mini .mini-label {
  position: absolute; top: 0.4rem; left: 0.5rem; z-index: 5;
  background: rgba(15,23,42,0.75); color: white; font-size: 0.75rem;
  padding: 0.15rem 0.6rem; border-radius: 999px; letter-spacing: 0.03em;
}
.ref-mini .mini-stage { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; transform-origin: top left; pointer-events: none; }
.ref-mini .mini-stage .slide { display: flex; position: absolute; inset: 0; animation: none; }
.ref-notes {
  background: #1E293B; border-radius: 10px; padding: 1.4rem 1.6rem;
  overflow-y: auto; min-height: 0; color: #F1F5F9;
}
.ref-notes h4 { color: #5EEAD4; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.8rem; }
#refNotes, #refNotes p, #refNotes li { font-size: 1.35rem; line-height: 1.65; color: #F1F5F9; }
#refNotes ul, #refNotes ol { margin: 0.4rem 0 1rem 1.4rem; }
#refNotes strong { color: #FDE68A; }
#refNotes .no-notes { color: #64748B; font-size: 1.1rem; font-style: italic; }
.ref-hint { grid-column: 1 / -1; color: #475569; font-size: 0.8rem; text-align: center; }

/* Print-friendly */
@media print {
  .slide { display: flex; page-break-after: always; }
  .nav, .slide-num, #refUI { display: none; }
  .notes { display: none !important; }
  html, body { height: auto; overflow: visible; }
}
</style>
</head>
<body>

<div class="deck">

{{SLIDES}}

</div>

<div class="slide-num">© Can Siebert · 2026 · <span id="slideCount">1 / 26</span></div>
<nav class="nav">
  <button onclick="prev()" title="Zurück (←)">←</button>
  <span class="nav-counter"><span id="slideNum">1</span></span>
  <button onclick="next()" title="Weiter (→)">→</button>
</nav>

<div id="refUI">
  <div class="ref-head">
    <span class="ref-title" id="refTitle"></span>
    <span class="ref-counter" id="refCounter">1</span>
    <span class="ref-timer" id="refTimer" title="Klick: Timer zurücksetzen">00:00</span>
    <span class="ref-clock" id="refClock"></span>
  </div>
  <div class="ref-left">
    <div class="ref-mini" id="miniCurrent"><span class="mini-label">Aktuelle Folie</span><div class="mini-stage" id="stageCurrent"></div></div>
    <div class="ref-mini next" id="miniNext"><span class="mini-label">Nächste Folie</span><div class="mini-stage" id="stageNext"></div></div>
  </div>
  <div class="ref-notes"><h4>🗒 Sprechnotizen</h4><div id="refNotes"></div></div>
  <div class="ref-hint">←/→ blättert in beiden Fenstern synchron · Dieses Fenster beim Teilen NICHT auswählen</div>
</div>

<!-- Rough.js für handgezeichnete Diagramme -->
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<script>
const slides = document.querySelectorAll('.slide');
let current = 0;

/* ---- Referentenansicht & Fenster-Synchronisation ---- */
const isRef = new URLSearchParams(location.search).has('ref');
const syncKey = 'praes-sync::' + location.pathname.split('/').pop();
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(syncKey) : null;

function broadcast(n) {
  if (bc) bc.postMessage(n);
  try { localStorage.setItem(syncKey, JSON.stringify({ n, t: Date.now() })); } catch (e) {}
}
if (bc) bc.onmessage = (e) => show(e.data, true);
window.addEventListener('storage', (e) => {
  if (e.key === syncKey && e.newValue) show(JSON.parse(e.newValue).n, true);
});

function openReferent() {
  const url = location.pathname + (location.search ? location.search + '&' : '?') + 'ref=1';
  window.open(url, 'praesReferent', 'width=1280,height=800');
}

function show(i, fromRemote) {
  slides.forEach(s => s.classList.remove('active'));
  current = Math.max(0, Math.min(i, slides.length - 1));
  slides[current].classList.add('active');
  document.getElementById('slideNum').textContent = current + 1;
  document.getElementById('slideCount').textContent = `${current + 1} / ${slides.length}`;
  if (isRef) updateRef();
  if (!fromRemote) broadcast(current);
}
function next() { show(current + 1); }
function prev() { show(current - 1); }
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { next(); e.preventDefault(); }
  if (e.key === 'ArrowLeft') prev();
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(slides.length - 1);
  if ((e.key === 'n' || e.key === 'N') && !isRef) openReferent();
});

/* Referentenfenster: Mini-Folien, Notizen, Uhr, Timer */
function fitStage(stageId, boxId) {
  const box = document.getElementById(boxId);
  const stage = document.getElementById(stageId);
  stage.style.transform = `scale(${box.clientWidth / 1280})`;
}
function cloneSlideInto(stageId, idx) {
  const stage = document.getElementById(stageId);
  stage.innerHTML = '';
  if (idx >= slides.length) {
    stage.innerHTML = '<div style="padding:4rem;font-size:2rem;color:#94A3B8">— Ende der Präsentation —</div>';
    return;
  }
  const c = slides[idx].cloneNode(true);
  c.classList.add('active');
  c.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
  stage.appendChild(c);
}
let timerStart = Date.now();
function updateRef() {
  document.getElementById('refCounter').textContent = `${current + 1} / ${slides.length}`;
  cloneSlideInto('stageCurrent', current);
  cloneSlideInto('stageNext', current + 1);
  fitStage('stageCurrent', 'miniCurrent');
  fitStage('stageNext', 'miniNext');
  const notes = slides[current].querySelector('.notes');
  document.getElementById('refNotes').innerHTML = notes
    ? notes.innerHTML
    : '<p class="no-notes">Keine Notizen zu dieser Folie.</p>';
  if (notes) document.getElementById('refNotes').closest('.ref-notes').scrollTop = 0;
}
if (isRef) {
  document.body.classList.add('ref-mode');
  document.getElementById('refTitle').textContent = document.title;
  setInterval(() => {
    document.getElementById('refClock').textContent =
      new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    const s = Math.floor((Date.now() - timerStart) / 1000);
    document.getElementById('refTimer').textContent =
      `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }, 1000);
  document.getElementById('refTimer').onclick = () => { timerStart = Date.now(); };
  window.addEventListener('resize', () => { fitStage('stageCurrent', 'miniCurrent'); fitStage('stageNext', 'miniNext'); });
  // Figuren (Rough.js) brauchen einen Moment — Mini-Ansicht erst nach Load aufbauen
  window.addEventListener('load', () => setTimeout(updateRef, 150));
}

// Rough.js-Skizzen
function makeRough(svgEl, fn) {
  const rc = rough.svg(svgEl);
  fn(rc, svgEl);
}

function box(rc, svg, x, y, w, h, fill, stroke) {
  const node = rc.rectangle(x, y, w, h, {
    roughness: 1.6, bowing: 1, fill: fill, fillStyle: 'solid', stroke: stroke, strokeWidth: 1.6
  });
  svg.appendChild(node);
}
function arrow(rc, svg, x1, y1, x2, y2, color) {
  svg.appendChild(rc.line(x1, y1, x2, y2, { roughness: 1.4, stroke: color, strokeWidth: 1.8 }));
  // Pfeilspitze
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const ah = 10;
  svg.appendChild(rc.line(x2, y2, x2 - ah * Math.cos(ang - Math.PI / 7), y2 - ah * Math.sin(ang - Math.PI / 7), { roughness: 1.2, stroke: color, strokeWidth: 1.8 }));
  svg.appendChild(rc.line(x2, y2, x2 - ah * Math.cos(ang + Math.PI / 7), y2 - ah * Math.sin(ang + Math.PI / 7), { roughness: 1.2, stroke: color, strokeWidth: 1.8 }));
}
function text(svg, x, y, str, opts = {}) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', x); t.setAttribute('y', y);
  t.setAttribute('text-anchor', opts.anchor || 'middle');
  t.setAttribute('font-family', 'Inter, sans-serif');
  t.setAttribute('font-size', opts.size || 15);
  t.setAttribute('fill', opts.color || '#0F172A');
  t.setAttribute('font-weight', opts.bold ? 700 : 500);
  t.textContent = str;
  svg.appendChild(t);
  return t;
}

{{FIGURES_JS}}
</script>

</body>
</html>
